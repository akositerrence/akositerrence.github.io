<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link href="/src/css/tail_main.css?v=gallery-load-more-8" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/src/media/favicon.png">
    <title>akositerrence - Gallery</title>
</head>

<body class="site-theme page-feed page-gallery">
    <!-- background -->
    <div class="site-background" aria-hidden="true"></div>
    <canvas class="site-grid-canvas" data-site-grid aria-hidden="true"></canvas>

    <!-- main -->
    <main class="main-portfolio-container">

        <!-- col1 -->
        <div class="portfolio-content-container">
            <!-- project gallery container -->
            <div class="gallery-container">
                <div class="portfolio-header-wrapper">
                    <div class="portfolio-header-center-line">
                    </div>
                </div>

                <div
                    id="gallery-grid"
                    class="project-gallery gallery-loading"
                    data-grid-anchor
                    data-grid-columns="responsive"
                >

                    <!-- instance -->
                    <div class="page-title-card brick" data-fit-card>
                        <div class="page-title">
                            <div class="page-title-group" data-fit-card-text>
                                <div id="gallery-page-title-text" class="standard-text">
                                    GALLERY
                                </div>
                                <div class="animated-underline back-to-home">
                                    <a href="../index.html"> Back to Home ↗&#xFE0E; </a>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="gallery-load-more-row" hidden>
                    <button
                        class="gallery-load-more-button"
                        type="button"
                        aria-controls="gallery-grid"
                        aria-expanded="false"
                    >
                        <span class="animated-underline">&#x2193;&#xFE0E; Load More &#x2193;&#xFE0E;</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/imagesloaded@4/imagesloaded.pkgd.min.js" defer></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js" defer></script>
    <script src="/src/js/site-grid.js" defer></script>
    <script src="/src/js/site-text-fit.js" defer></script>
    <script src="/src/js/gallery.js?v=gallery-load-more-9" defer></script>
</body>

</html>
